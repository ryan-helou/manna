name: Manna evening reminder

# Runs every hour. The endpoint sends only to people whose chosen reminder hour
# it currently is, so everyone gets nudged at the hour they picked rather than
# all at seven. Deduped per person per day server side.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  nudge:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the evening nudge
        run: |
          curl -fsS --max-time 60 \
            "${{ secrets.APP_URL }}/api/cron/tick?key=${{ secrets.CRON_SECRET }}&job=evening" \
            && echo " evening nudge triggered"
