name: Manna evening reminder

# One nudge a day to anyone who has not logged today's reading. GitHub cron runs
# in UTC; 23:00 UTC is 19:00 in America/Toronto.
on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

jobs:
  nudge:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the evening nudge
        run: |
          curl -fsS --max-time 60 \
            "${{ secrets.APP_URL }}/api/cron/tick?key=${{ secrets.CRON_SECRET }}&job=evening" \
            && echo " evening nudge triggered"
